<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>悬浮标</title>
    <!--
      tokens 必须排在前面：下面那份样式表通篇在读它定义的变量。

      这里**不**设 data-material：悬浮标要不规则形状和鼠标穿透，
      窗口只能是透明的，享受不到亚克力，也就没有两条路可选。
      它用的是那几个不随材质变的 token（--surface-solid、语义色、字体）。
    -->
    <link rel="stylesheet" href="./tokens.css" />
    <link rel="stylesheet" href="./pet.css" />
  </head>
  <body>
    <!--
      图标取自 Tabler Icons，路径由 tools/sync-icons.mjs 按 data-tabler 填入，别手改。

      两种形态共用一个 .pill 容器：
      待机时是横向胶囊（三个按钮），送出后收拢成 52×52 的圆，圆上跑进度环。
      形态切换靠 CSS 过渡 width，所以是连续变形而不是两个元素互相替换。
    -->
    <div class="stage" id="stage" data-phase="idle" data-mode="indeterminate">
      <div class="pill" id="pill">
        <!-- 角色外观时这里放角色（avatar.ts 往里塞一个 .avatar-art 的 <svg> 或 <img>），胶囊外观时空着 -->
        <div class="avatar" id="avatar" aria-hidden="true"></div>

        <!-- 进度环：只在收拢成圆之后可见 -->
        <svg class="ring" viewBox="0 0 52 52" aria-hidden="true">
          <circle class="ring-track" cx="26" cy="26" r="23" />
          <circle class="ring-arc" id="ringArc" cx="26" cy="26" r="23" />
          <!--
            同时发给多个目标时，圆周按目标数切成几段，每段单独表示一轨。
            单目标时这里是空的，走上面那条整圈的 ring-arc——
            最常用的那条路一个字节都没多花。
          -->
          <g id="ringSegs"></g>
        </svg>

        <div class="actions" id="actions">
          <!-- 编辑：唤起输入条，主操作 -->
          <button class="act" id="btnCompose" type="button" title="输入" aria-label="输入">
            <svg data-tabler="pencil" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4l10.5 -10.5a2.828 2.828 0 1 0 -4 -4l-10.5 10.5v4" /><path d="M13.5 6.5l4 4" /></svg>
          </button>

          <span class="divider"></span>

          <!-- 临时篮子：也可在拖动内容时左右摇鼠标唤出 -->
          <button class="act" id="btnBasket" type="button" title="临时篮子" aria-label="临时篮子">
            <svg data-tabler="basket" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-linecap="round" stroke-linejoin="round"><path d="M10 14a2 2 0 1 0 4 0a2 2 0 0 0 -4 0" /><path d="M5.001 8h13.999a2 2 0 0 1 1.977 2.304l-1.255 7.152a3 3 0 0 1 -2.966 2.544h-9.512a3 3 0 0 1 -2.965 -2.544l-1.255 -7.152a2 2 0 0 1 1.977 -2.304" /><path d="M17 10l-2 -6" /><path d="M7 10l2 -6" /></svg>
          </button>

          <span class="divider"></span>

          <!-- 展开：目标切换与其它操作 -->
          <button class="act" id="btnMenu" type="button" title="更多" aria-label="更多" aria-expanded="false">
            <svg class="chevron" data-tabler="chevron-down" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6l6 -6" /></svg>
          </button>
        </div>

        <!-- 收拢成圆之后，中心显示一个随状态变化的小标记 -->
        <div class="core" id="core" aria-hidden="true"></div>
      </div>

      <!-- 状态气泡：出错或等待过久时出现。显示在胶囊上方 -->
      <div class="bubble" id="bubble" hidden></div>
    </div>

    <script type="module" src="./pet.ts"></script>
  </body>
</html>
